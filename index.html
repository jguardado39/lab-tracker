<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Time Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="dashboard-container">
  
  <div class="sidebar-panel">
    <h1><i class="ti ti-flask" aria-hidden="true"></i> Lab Tracker</h1>
    
    <div class="status-banner">
      <div class="status-meta">
        <span class="status-dot dot-out" id="status-dot"></span>
        <span id="status-label" style="font-weight:500;">Not clocked in</span>
      </div>
      <div id="live-clock">--:--</div>
      <div id="today-date" class="date-subtext"></div>
    </div>

    <div class="sidebar-metrics">
      <div class="mini-metric">
        <span>In:</span> <strong id="m-in">—</strong>
      </div>
      <div class="mini-metric">
        <span>Lunch:</span> <strong id="m-lunch">—</strong>
      </div>
      <div class="mini-metric highlighted">
        <span>Worked:</span> <strong id="m-worked">0h 0m</strong>
      </div>
    </div>

    <div class="input-stack">
      <select id="tag-select" class="tag-dropdown">
        <option value="General">🏷️ General Lab</option>
        <option value="Benchwork">🔬 Benchwork</option>
        <option value="Data Analysis">💻 Data Analysis</option>
        <option value="Writing">📝 Writing/Paper</option>
        <option value="Lab Meeting">👥 Meeting/Seminar</option>
      </select>
      <input type="text" id="note-input" placeholder="Optional details..." maxlength="80" />
    </div>

    <div class="actions-stack">
      <button class="btn btn-primary" id="btn-in" onclick="clockIn()"><i class="ti ti-login" aria-hidden="true"></i> Clock In</button>
      <button class="btn" id="btn-lunch" onclick="toggleLunch()" disabled><i class="ti ti-soup" aria-hidden="true"></i> <span id="lunch-label">Lunch</span></button>
      <button class="btn" id="btn-out" onclick="clockOut()" disabled><i class="ti ti-logout" aria-hidden="true"></i> Clock Out</button>
    </div>

    <div class="today-log-card">
      <div class="card-header">Today's Log <span id="log-badge" class="badge">0</span></div>
      <div id="log-body" class="scroll-list-mini"><div class="empty-text">No entries.</div></div>
    </div>
  </div>

  <div class="main-panel">
    <div class="weekly-row">
      <div class="weekly-meta">
        <span><i class="ti ti-calendar-stats" aria-hidden="true"></i> <strong>Weekly Tracking</strong></span>
        <span id="weekly-hours-text" class="weekly-target-text">0.0 / 40.0 hrs</span>
      </div>
      <div class="progress-bar-container">
        <div id="weekly-progress-bar" class="progress-bar-fill" style="width: 0%"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-node">Days Worked: <span id="cal-days">0</span></div>
      <div class="stat-node">Total: <span id="cal-total">0h 0m</span></div>
      <div class="stat-node">Avg/Day: <span id="cal-avg">—</span></div>
    </div>

    <div class="calendar-wrapper">
      <div class="cal-nav">
        <div class="cal-nav-arrows">
          <button onclick="calPrev()"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
          <button onclick="calNext()"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
        </div>
        <span class="cal-title" id="cal-title"></span>
        <button class="btn btn-sm btn-primary" onclick="openManualModal()"><i class="ti ti-plus" aria-hidden="true"></i> Add Entry</button>
      </div>
      <div class="cal-dow">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="bottom-split">
      <div class="split-card">
        <div class="card-header"><i class="ti ti-chart-pie-2" aria-hidden="true"></i> Projects</div>
        <div id="tag-breakdown-body" class="scroll-list-mini"></div>
      </div>
      <div class="split-card">
        <div class="card-header" id="detail-header">History Details</div>
        <div id="detail-body" class="scroll-list-mini"><div class="empty-text">Select a day.</div></div>
      </div>
    </div>

  </div>
</div>

<div class="modal-overlay" id="manual-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Add Manual Log</span>
      <i class="ti ti-x" style="cursor:pointer;color:var(--t3)" onclick="closeManualModal()" aria-label="Close configuration"></i>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="m-type">Punch Configuration</label>
        <select id="m-type" class="tag-dropdown" style="width:100%;" onchange="toggleModalFields()">
          <option value="full">📅 Full Custom Shift</option>
          <option value="in">🔒 Single Clock In</option>
          <option value="out">🔓 Single Clock Out</option>
          <option value="lunch">☕ Isolated Break/Lunch</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="m-date">Date</label>
          <input type="date" id="m-date" required />
        </div>
        <div class="form-group">
          <label for="m-tag">Project Tag</label>
          <select id="m-tag" class="tag-dropdown" style="width:100%;">
            <option value="General">General Lab</option>
            <option value="Benchwork">Benchwork</option>
            <option value="Data Analysis">Data Analysis</option>
            <option value="Writing">Writing/Paper</option>
            <option value="Lab Meeting">Meeting/Seminar</option>
          </select>
        </div>
      </div>

      <div class="form-row" id="row-times">
        <div class="form-group" id="box-in">
          <label for="m-clock-in" id="lbl-clock-in">Clock In Time</label>
          <input type="time" id="m-clock-in" />
        </div>
        <div class="form-group" id="box-out">
          <label for="m-clock-out">Clock Out Time</label>
          <input type="time" id="m-clock-out" />
        </div>
      </div>

      <div class="form-group" id="box-lunch-dur">
        <label for="m-lunch-dur">Lunch Break Duration (Minutes)</label>
        <input type="number" id="m-lunch-dur" min="0" value="0" />
      </div>

      <div class="form-group">
        <label for="m-note">Log Note / Description</label>
        <input type="text" id="m-note" placeholder="e.g., Forgot to punch card" maxlength="80" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeManualModal()">Cancel</button>
      <button class="btn btn-sm btn-primary" onclick="submitManualEntry()">Save Log</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
